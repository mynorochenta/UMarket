# Copia este archivo a application.properties y rellena los valores reales.
# application.properties está en .gitignore — NUNCA subir a git.

spring.datasource.url=jdbc:mysql://localhost:3306/umarket_db
spring.datasource.username=root
spring.datasource.password=TU_PASSWORD_MYSQL

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Email (Gmail App Password — no la contraseña normal de tu cuenta)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=TU_CORREO@gmail.com
spring.mail.password=TU_APP_PASSWORD
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Cloudinary
cloudinary.cloud-name=TU_CLOUD_NAME
cloudinary.api-key=TU_API_KEY
cloudinary.api-secret=TU_API_SECRET

# JWT — mínimo 32 caracteres aleatorios
jwt.secret=GENERA_UN_SECRET_LARGO_Y_ALEATORIO_AQUI

# URL base (cambiar en producción)
app.url=http://localhost:8080
