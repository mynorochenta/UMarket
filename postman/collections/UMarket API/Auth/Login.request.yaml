$kind: http-request
description: Devuelve un JWT que se guarda automáticamente en la variable {{token}}.
url: "{{baseUrl}}/api/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "email": "tu_correo@usac.edu.gt",
      "contrasena": "tu_contrasena"
    }
scripts:
  - type: afterResponse
    code: |-
      var json = pm.response.json();
      if (json.token) {
          pm.collectionVariables.set('token', json.token);
          console.log('Token guardado:', json.token);
      }
order: 1000
